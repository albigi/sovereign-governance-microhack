# Exemption check for an exception repository created by `exemptions.py init-repo`.
# Make both jobs required status checks on main and require one approving review.
# The rules (tools/, policy/, lab.json) are taken from the base commit, so a pull request
# cannot loosen the rules it is judged by. Changes to .github/ itself still need a reviewer.
name: exemption-check

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use the rules from the base branch
        run: git checkout "${{ github.event.pull_request.base.sha }}" -- tools policy lab.json
      - name: Download the pinned catalogue for the modal-verb cross-check
        continue-on-error: true
        run: python3 tools/gspp_extract.py --output tools/out/gspp-extract.csv
      - name: Validate the exemption files this pull request adds or changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/exemptions.py validate --pr "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

  decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use the rules from the base branch
        run: git checkout "${{ github.event.pull_request.base.sha }}" -- tools policy lab.json
      - name: Check the risk owner's approval of the current head commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/exemptions.py decision --pr "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
